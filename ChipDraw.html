let gesture=null;choose.addEventListener('pointerdown',e=>{if(e.button!==0)return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,index:0,moved:false};choose.setPointerCapture(e.pointerId);e.preventDefault()});choose.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>5)gesture.moved=true;if(!gesture.moved)return;row.classList.add('layer-dragging');const others=[...list.children].filter(n=>n!==row);gesture.index=others.filter(n=>e.clientY>n.getBoundingClientRect().top+n.getBoundingClientRect().height/2).length;for(const n of list.children)n.classList.remove('layer-drop-before','layer-drop-after');if(gesture.index<others.length)others[gesture.index].classList.add('layer-drop-before');else if(others.length)others.at(-1).classList.add('layer-drop-after');e.preventDefault()});choose.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const state=gesture;gesture=null;if(choose.hasPointerCapture(e.pointerId))choose.releasePointerCapture(e.pointerId);if(state.moved){layers.reorderTo(group,layers.groups().length-1-state.index);renderLayers()}else editName()});choose.addEventListener('pointercancel',()=>{gesture=null;renderLayers()});choose.addEventListener('lostpointercapture',()=>{if(gesture){gesture=null;renderLayers()}});choose.addEventListener('click',e=>{if(e.detail===0)editName()});
for(const kind of ['visible','filtered','locked']){const button=document.createElement('button'),enabled=kind==='visible'?group.getAttribute('display')!=='none':group.getAttribute(kind==='filtered'?'data-filtered':'data-locked')==='true';ChipUI.iconButton(button,kind==='filtered'?(enabled?'filterOff':'filter'):kind==='visible'?(enabled?'eye':'eyeOff'):(enabled?'lock':'unlock'),name+'：點擊後'+(kind==='visible'?(enabled?'隱藏':'顯示'):kind==='filtered'?(enabled?'可選':'不可選'):(enabled?'解鎖':'鎖定')));button.setAttribute('aria-pressed',String(enabled));button.classList.toggle('layer-locked',kind==='locked'&&enabled);button.classList.toggle('layer-unlocked',kind==='locked'&&!enabled);button.onclick=()=>layers.toggle(group,kind);row.append(button)}const remove=document.createElement('button');ChipUI.iconButton(remove,'trash',name+'：刪除圖層及其物件');remove.disabled=layers.groups().length===1;remove.onclick=()=>layers.remove(group);row.append(remove);list.append(row);}}

function showLayers(open){if(!open)closeLayerCreation();$('layersPanel').hidden=!open;$('layersToggle').setAttribute('aria-expanded',String(open));if(open)renderLayers()}
for(const [id,icon,label]of [['layerAddToggle','add','添加圖層'],['layersToggle','layers','圖層'],['layersClose','close','關閉圖層'],['layerAddArtwork','addArtwork','新增美工圖層'],['layerAddPcb','addPcb','新增印刷電路層'],['layerAddVector','addVector','新增矢線層']])ChipUI.iconButton($(id),icon,label);function positionLayerCreation(){const popup=$('layerCreation');if(popup.hidden)return;const r=$('layerAddToggle').getBoundingClientRect(),w=Math.min(340,innerWidth-24),top=document.querySelector('header').getBoundingClientRect().bottom+8;popup.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';popup.style.top=Math.max(top,Math.min(r.bottom+6,innerHeight-140))+'px';popup.style.width=w+'px';popup.style.maxHeight=Math.max(100,innerHeight-parseFloat(popup.style.top)-8)+'px'}function closeLayerCreation(){$('layerCreation').hidden=true;$('layerAddToggle').setAttribute('aria-expanded','false')} $('layerAddToggle').onclick=()=>{const open=$('layerCreation').hidden;$('layerCreation').hidden=!open;$('layerAddToggle').setAttribute('aria-expanded',String(open));positionLayerCreation()};document.addEventListener('pointerdown',e=>{if(!$('layerCreation').contains(e.target)&&!$('layerAddToggle').contains(e.target))closeLayerCreation()},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayerCreation()});window.addEventListener('resize',closeLayerCreation);$('layersToggle').setAttribute('aria-controls','layersPanel');$('layersToggle').setAttribute('aria-expanded','false');$('layersToggle').onclick=()=>showLayers($('layersPanel').hidden);$('layersClose').onclick=()=>showLayers(false);$('layerAddArtwork').onclick=()=>layers.add({type:'artwork'});$('layerAddVector').onclick=()=>layers.add({type:'vector'});$('layerAddPcb').onclick=()=>{const open=$('pcbLayerChoices').hidden;$('pcbLayerChoices').hidden=!open;$('layerAddPcb').setAttribute('aria-expanded',String(open));refreshPcbChoices()};$('layerAddInnerSignal').onclick=()=>{let index=1;const roles=layers.groups().map(g=>g.getAttribute('data-pcb-role'));while(roles.includes('copper-inner-'+index))index++;layers.add({type:'pcb',role:'copper-inner-'+index,name:'內層信號 '+index});refreshPcbChoices()};for(const button of $('pcbLayerChoices').querySelectorAll('[data-pcb-role]'))button.onclick=()=>{layers.add({type:'pcb',role:button.getAttribute('data-pcb-role'),name:button.getAttribute('aria-label')?.replace(/^新增/,'')||button.textContent});refreshPcbChoices()};renderLayers();
ChipUI.floatingPanel($('layersPanel'),{minWidth:280,minHeight:180});ChipUI.resizePanel(panel,{minWidth:190,minHeight:150});window.addEventListener('selectionstylechange',()=>paintSelection());window.addEventListener('resize',view);initViewSettings();view();snapshot();
let ringTouchCheckpoint=null;
const ringGesture=ChipRing.mount({surface:svg,viewport:$('view'),getCamera:drawCamera,applyCamera:camera=>{applyDrawCamera(camera);view()},limits:{min:.1,max:15},
 onTouchStart:()=>{ringTouchCheckpoint={html:art.innerHTML,history:[...history],future:[...future],points:[...points],selectedIndices:selection.items.map(n=>[...art.querySelectorAll('*')].indexOf(n)),anchor:clickAnchor}},
 onTouchEnd:()=>{ringTouchCheckpoint=null},
 onStart:kind=>{if(kind==='touch'&&ringTouchCheckpoint){art.innerHTML=ringTouchCheckpoint.html;history=ringTouchCheckpoint.history;future=ringTouchCheckpoint.future;points=ringTouchCheckpoint.points;selection.replace(ringTouchCheckpoint.selectedIndices.map(i=>art.querySelectorAll('*')[i]).filter(Boolean));selected=selection.primary;layers.normalize();renderLayers();clickAnchor=ringTouchCheckpoint.anchor;renderSelection()}drag=null;pointers.clear();preview.innerHTML='';paintSelection()},
 onCancel:()=>{if(drag&&(drag.kind==='pen'||drag.kind==='move'&&drag.moved)){const before=history.pop();if(before!==undefined)restore(before)}if(points.length){points=[];if(tool==='poly')history.pop()}drag=null;clickAnchor=null;pointers.clear();preview.innerHTML='';paintSelection()},
 onFinish:()=>{drag=null;pointers.clear();ringTouchCheckpoint=null;if(points.length>1)polyPreview()}
});
