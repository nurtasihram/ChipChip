(()=>{
 const dock=document.getElementById('categoryDrawer'),handle=document.getElementById('splitHandle');
 const COLLAPSED=22, MIN_OPEN=120;
 let active=null,startY=0,startH=0,moved=false,lastOpen=Math.min(340,Math.max(190,window.innerHeight*.32));
 const maxHeight=()=>Math.max(MIN_OPEN,Math.min(window.innerHeight*.72,window.innerHeight-210));
 function apply(h){
   if(h<=COLLAPSED+10){
     dock.classList.add('is-collapsed');
     document.documentElement.style.setProperty('--dock-height',COLLAPSED+'px');
     handle.setAttribute('aria-expanded','false');
   }else{
     h=Math.min(maxHeight(),Math.max(MIN_OPEN,h));
     dock.classList.remove('is-collapsed');
     document.documentElement.style.setProperty('--dock-height',h+'px');
     lastOpen=h;handle.setAttribute('aria-expanded','true');
   }
 }
 function toggle(){apply(dock.classList.contains('is-collapsed')?lastOpen:COLLAPSED)}
 handle.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   active=e.pointerId;startY=e.clientY;startH=dock.getBoundingClientRect().height;moved=false;
   handle.setPointerCapture(e.pointerId);e.preventDefault();
 });
 handle.addEventListener('pointermove',e=>{
   if(active!==e.pointerId)return;
   const delta=startY-e.clientY;
   if(Math.abs(delta)>7)moved=true;
   if(!moved)return;
   let next=startH+delta;
   if(next<MIN_OPEN*.65)apply(COLLAPSED);
   else apply(next);
 });
 function stop(e){
   if(active!==e.pointerId)return;
   active=null;
   if(!moved)toggle();
   else if(!dock.classList.contains('is-collapsed')&&dock.getBoundingClientRect().height<MIN_OPEN)apply(COLLAPSED);
 }
 handle.addEventListener('pointerup',stop);
 handle.addEventListener('pointercancel',e=>{if(active===e.pointerId)active=null});
 handle.addEventListener('keydown',e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}
   else if(e.key==='ArrowUp'){e.preventDefault();apply(dock.getBoundingClientRect().height+45)}
   else if(e.key==='ArrowDown'){e.preventDefault();apply(dock.getBoundingClientRect().height-45)}
 });
 window.addEventListener('resize',()=>{if(!dock.classList.contains('is-collapsed'))apply(Math.min(lastOpen,maxHeight()))});
})();

 }catch(e){alert('打開失敗：'+e.message);return false}return true}
 // Multiple Document Interface: each tab stores independent PinView data and view state.
 const documents=[];
 let activeDocumentId=null, nextDocumentId=1;
 const mdiList=document.getElementById('mdiDocList');
 const mdiCount=document.getElementById('mdiDocCount');
 function storeActiveDocument(){
   const doc=documents.find(d=>d.id===activeDocumentId);
   if(!doc)return;
   doc.data=encodePinView();doc.filename=currentFilename;
 }
 function updateDocumentList(){
   mdiList.replaceChildren();mdiCount.textContent=String(documents.length);
   for(const doc of documents){
     const row=document.createElement('div');row.className='mdiRow'+(doc.id===activeDocumentId?' active':'');row.setAttribute('role','listitem');
     const switcher=document.createElement('button');switcher.type='button';switcher.className='mdiSwitch';switcher.setAttribute('aria-current',String(doc.id===activeDocumentId));
     const dot=document.createElement('span');dot.className='mdiMark';
     const text=document.createElement('span');text.className='mdiDocText';
     const name=document.createElement('span');name.className='mdiDocTitle';name.textContent=doc.id===activeDocumentId?title.textContent:doc.data.title;
     const meta=document.createElement('span');meta.className='mdiDocMeta';meta.textContent=doc.filename+' · '+doc.data.pins+' pins';
     text.append(name,meta);switcher.append(dot,text);
     switcher.onclick=async()=>{if(doc.id===activeDocumentId){close();return}storeActiveDocument();if(await loadProjectObject(doc.data,doc.filename)){activeDocumentId=doc.id;updateDocumentList();close()}};
     const x=document.createElement('button');x.type='button';x.className='mdiClose';x.textContent='×';x.title='關閉圖紙';x.setAttribute('aria-label','關閉 '+doc.data.title);x.disabled=documents.length===1;
     x.onclick=async()=>{if(documents.length===1)return;const i=documents.findIndex(d=>d.id===doc.id);if(i<0)return;if(doc.id!==activeDocumentId){documents.splice(i,1);updateDocumentList();return}const other=documents[i===0?1:i-1];if(await loadProjectObject(other.data,other.filename)){documents.splice(i,1);activeDocumentId=other.id;updateDocumentList()}};
     row.append(switcher,x);mdiList.append(row);
   }
 }
 function addDocument(data,filename){const doc={id:nextDocumentId++,data:structuredClone(data),filename};documents.push(doc);activeDocumentId=doc.id;updateDocumentList()}
 // Capture the bundled E38xx document after all initialization scripts have executed.
 window.addEventListener('load',()=>{if(!documents.length)addDocument(encodePinView(),currentFilename)},{once:true});
 picker.addEventListener('change',async()=>{
   const file=picker.files?.[0];picker.value='';if(!file)return;
   let obj;try{obj=JSON.parse(await file.text())}catch(e){alert('JSON 解析失敗：'+e.message);return}
   storeActiveDocument();
   if(await loadProjectObject(obj,file.name)){addDocument(encodePinView(),file.name);close()}
 });
 // Keep list labels in sync with the active title and save operations.
 document.getElementById('fileRename').addEventListener('click',()=>{if(activeDocumentId){const doc=documents.find(d=>d.id===activeDocumentId);if(doc)doc.data.title=title.textContent;updateDocumentList()}});
 document.getElementById('fileSaveAs').addEventListener('click',()=>{if(activeDocumentId){const doc=documents.find(d=>d.id===activeDocumentId);if(doc)doc.filename=currentFilename;updateDocumentList()}});
})();

// Settings split-pane: drag to fully collapse, tap grip to restore.
(()=>{
 const panel=document.getElementById('advanced');
 const pin=document.getElementById('pinSettings');
 const handle=document.getElementById('settingsResizeHandle');
 const scroll=document.getElementById('advancedBody');
 const viewport=document.getElementById('viewport');
 const parent=panel.parentNode, next=panel.nextSibling;
 const wide=()=>matchMedia('(min-width:800px)').matches;
 const collapseThreshold=55;
 let docked=false,gesture=null,lastOpen=0;
 const axisSize=()=>panel.getBoundingClientRect()[wide()?'width':'height'];
 const maxSize=()=>wide()?Math.min(650,innerWidth*.65):Math.min(innerHeight*.72,innerHeight-170);
 const minOpen=()=>wide()?220:110;
 function setSize(n){
   const v=Math.min(maxSize(),Math.max(minOpen(),n));
   lastOpen=v;
   document.body.style.setProperty('--settings-size',v+'px');
   requestAnimationFrame(resize);
 }
 function enter(){
   if(docked)return;
   docked=true;panel.open=true;
   document.body.insertBefore(panel,viewport);
   document.body.classList.add('settings-pinned');
   scroll.scrollTop=0;
   setSize(lastOpen|| (wide()?340:Math.round(innerHeight*.36)));
   requestAnimationFrame(()=>{resize();updateSettingsTop()});
 }
 function leave(){
   if(!docked)return;
   docked=false;
   document.body.classList.remove('settings-pinned','settings-folded');
   parent.insertBefore(panel,next);panel.open=false;
   requestAnimationFrame(()=>{resize();updateSettingsTop()});
 }
 pin.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();enter()});
 panel.addEventListener('toggle',()=>{if(docked&&!panel.open)panel.open=true});
 handle.addEventListener('pointerdown',e=>{
   if(!docked)return;
   e.preventDefault();e.stopPropagation();
   handle.setPointerCapture(e.pointerId);
   gesture={id:e.pointerId,x:e.clientX,y:e.clientY,size:axisSize(),moved:false,target:axisSize()};
 });
 handle.addEventListener('pointermove',e=>{
   if(!gesture||gesture.id!==e.pointerId)return;
   const delta=wide()?gesture.x-e.clientX:e.clientY-gesture.y;
   if(Math.abs(delta)>6)gesture.moved=true;
   if(gesture.moved){gesture.target=gesture.size+delta;if(gesture.target>minOpen())setSize(gesture.target);}
 });
 handle.addEventListener('pointerup',e=>{
   if(!gesture||gesture.id!==e.pointerId)return;
   const {moved,target}=gesture;gesture=null;
   if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);
   if(!moved||target<=minOpen())leave();
 });
 handle.addEventListener('pointercancel',()=>gesture=null);
 handle.addEventListener('lostpointercapture',()=>gesture=null);
 handle.addEventListener('keydown',e=>{
   if(!docked)return;
   if(e.key==='Enter'||e.key===' '){e.preventDefault();leave();return}
   if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
     e.preventDefault();const delta=wide()?(e.key==='ArrowLeft'?35:e.key==='ArrowRight'?-35:0):(e.key==='ArrowDown'?35:e.key==='ArrowUp'?-35:0);
     if(delta){if(axisSize()+delta<=minOpen())leave();else setSize(axisSize()+delta);}
   }
 });
 // Closing the split restores the floating settings button; no collapsed dock remains.
 window.addEventListener('resize',()=>{if(docked){setSize(Math.min(lastOpen,maxSize()));requestAnimationFrame(resize)}});
})();
</script></body></html>
