const precision=id=>Math.max(0,Math.min(9,Math.trunc(Number($(id).value)||0)));

function angleLabel(degrees){return ChipUI.angle.format(degrees,$('angleMode').value,$('anglePrecision').value)}

function drawCamera(){const r=svg.getBoundingClientRect(),t=viewAngle*Math.PI/180,c=Math.cos(t),s=Math.sin(t),m=viewMirrored?-1:1;return new ChipViewport.Camera({x:r.width/2+scale*(c*m*ox-s*oy),y:r.height/2+scale*(s*m*ox+c*oy),scale,angle:t,mirror:viewMirrored})}

function initViewSettings(){

 write:s=>{gridMode=s.mode;gridDirections=s.directions;gridCircle=s.circle;gridLinked=s.linked;Object.assign(modeDirections,s.modeStates);Object.assign(widthUnits,s.widthUnits);overflowUnit=s.overflowUnit},

 });

 $('fileSaveAs').onclick=()=>$('fileSave').click();$('fileRename').onclick=()=>{const title=prompt('圖紙名稱',$('projectTitle').textContent);if(title&&title.trim()){$('projectTitle').textContent=title.trim();document.title=title.trim()}ChipUI.closeMenu()};
}

const layers=ChipDrawingLayers.create({art,beforeChange:snapshot,changed:()=>{if(selected&&!layers.editable(layers.owner(selected)))selected=null;clickAnchor=null;drag=null;points=[];preview.innerHTML='';renderSelection();renderLayers();view()}});
function refreshPcbChoices(){for(const button of $('pcbLayerChoices').children){const role=button.getAttribute('data-pcb-role');button.disabled=!['drill','mill'].includes(role)&&layers.groups().some(g=>g.getAttribute('data-layer-type')==='pcb'&&g.getAttribute('data-pcb-role')===role)}}
function renderLayers(){refreshPcbChoices();const list=$('layerList'),destination=$('layerDestination');list.replaceChildren();destination.replaceChildren();for(const group of layers.groups().reverse()){const name=group.getAttribute('data-name')||'圖層',row=document.createElement('div');row.className='drawing-layer-row';row.setAttribute('data-layer-id',group.getAttribute('data-drawing-layer'));row.classList.toggle('active',group===layers.active());const choose=document.createElement('button');choose.className='layer-name';choose.textContent=name;choose.setAttribute('aria-label',name+'：點擊重新命名，拖動調整順序');choose.setAttribute('aria-pressed',String(group===layers.active()));row.append(choose);

for(const kind of ['visible','locked']){const button=document.createElement('button'),enabled=kind==='visible'?group.getAttribute('display')!=='none':group.getAttribute('data-locked')==='true';ChipUI.iconButton(button,kind==='visible'?(enabled?'eye':'eyeOff'):(enabled?'lock':'unlock'),name+'：'+(kind==='visible'?(enabled?'隱藏圖層':'顯示圖層'):(enabled?'解鎖圖層':'鎖定圖層')));button.setAttribute('aria-pressed',String(enabled));button.onclick=()=>layers.toggle(group,kind);row.append(button)}const remove=document.createElement('button');ChipUI.iconButton(remove,'trash',name+'：刪除圖層及其物件');remove.disabled=layers.groups().length===1;remove.onclick=()=>layers.remove(group);row.append(remove);list.append(row);const option=document.createElement('option');option.value=group.getAttribute('data-drawing-layer');option.textContent=name;destination.append(option)}destination.value=layers.active().getAttribute('data-drawing-layer')}

for(const [id,icon,label]of [['layersToggle','layers','圖層'],['layersClose','close','關閉圖層'],['layerAddArtwork','addArtwork','新增美工圖層'],['layerAddPcb','addPcb','新增印刷電路層'],['layerAddVector','addVector','新增矢線層'],['layerMove','move','移動選取物件至指定圖層']])ChipUI.iconButton($(id),icon,label);$('layersToggle').setAttribute('aria-controls','layersPanel');$('layersToggle').setAttribute('aria-expanded','false');$('layersToggle').onclick=()=>showLayers($('layersPanel').hidden);$('layersClose').onclick=()=>showLayers(false);$('layerAddArtwork').onclick=()=>layers.add({type:'artwork'});$('layerAddVector').onclick=()=>layers.add({type:'vector'});$('layerAddPcb').onclick=()=>{const open=$('pcbLayerChoices').hidden;$('pcbLayerChoices').hidden=!open;$('layerAddPcb').setAttribute('aria-expanded',String(open));refreshPcbChoices()};for(const button of $('pcbLayerChoices').children)button.onclick=()=>{layers.add({type:'pcb',role:button.getAttribute('data-pcb-role'),name:button.textContent});$('pcbLayerChoices').hidden=true;$('layerAddPcb').setAttribute('aria-expanded','false')};$('layerMove').onclick=()=>layers.move(selected,$('layerDestination').value);renderLayers();
