<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VectorBoard · ChipChip</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eaf1ff;font:13px system-ui;overflow:hidden}header{height:40px;display:flex;align-items:center;gap:5px;padding:4px 7px;background:#152238}button,input{background:#1c2a42;border:1px solid #40536e;color:inherit;border-radius:7px;padding:7px;font:inherit}button.active{background:#315b8d;border-color:#7cb4fa}header strong{margin-right:auto;white-space:nowrap}#tools{display:flex;gap:4px;overflow-x:auto;padding:5px;background:#101a2b}#tools button{flex:none;min-width:38px}#view{height:calc(100dvh - 85px);position:relative;touch-action:none;overflow:hidden}svg{width:100%;height:100%;touch-action:none;display:block}#status{position:absolute;left:7px;bottom:7px;background:#152238c9;padding:5px 8px;border-radius:7px;pointer-events:none}#panel{position:absolute;right:7px;top:8px;width:190px;background:#152238ed;border:1px solid #40536e;border-radius:9px;padding:9px;display:none;box-shadow:0 6px 20px #0008}#panel.show{display:block}#panel label{display:flex;justify-content:space-between;align-items:center;margin:7px 0}#panel input{width:95px;min-width:0}#panel input[type=color]{height:32px;padding:2px}#panel input[type=number]{width:65px}#panel button{width:100%}#hint{position:absolute;left:7px;top:8px;color:#aebbd0;pointer-events:none;font-size:11px}</style><header><strong>◇ VectorBoard</strong><button id="undo">↶</button><button id="redo">↷</button><button id="open">開啟</button><button id="save">SVG ↓</button><button id="props">☰</button></header><div id="tools"><button data-tool="select" class="active">↖</button><button data-tool="pan">✋</button><button data-tool="line">╱</button><button data-tool="rect">▭</button><button data-tool="ellipse">◯</button><button data-tool="poly">⌁</button><button data-tool="pen">✎</but const ns='http://www.w3.org/2000/svg',svg=document.querySelector('#svg'),art=document.querySelector('#art'),preview=document.querySelector('#preview'),status=document.querySelector('#status');let tool='select',selected=null,drag=null,points=[],scale=1,ox=0,oy=0,history=[],future=[],showGrid=true;const $=id=>document.getElementById(id);function el(tag,attrs={},parent=art){let n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.append(n);return n}function snapshot(){history.push(art.innerHTML);if(history.length>60)history.shift();future=[]}function restore(html){art.innerHTML=html;selected=null;renderSelection()}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));points=[];preview.innerHTML='';updateStatus()}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));function updateStatus(){status.textContent=Math.round(scale*100)+'% · '+({select:'選取',pan:'平移',line:'直線',rect:'矩形',ellipse:'橢圓',poly:'折線',pen:'自由路徑'}[tool])}function view(){let r=svg.getBoundingClientRect();svg.setAttribute('viewBox',`${-r.width/2/scale-ox} ${-r.height/2/scale-oy} ${r.width/scale} ${r.height/scale}`);updateStatus()}function pos(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function snap(p){return $('snap').checked?{x:Math.round(p.x/20)*20,y:Math.round(p.y/20)*20}:p}function style(){return {stroke:$('stroke').value,'stroke-width':$('sw').value,fill:$('noFill').checked?'none':$('fill').value,'stroke-linecap':'round','stroke-linejoin':'round'}}function hit(e){let t=e.target;return t.parentNode===art?t:null}function renderSelection(){art.querySelectorAll('.chosen').forEach(n=>n.classList.remove('chosen'));if(selected){selected.classList.add('chosen');selected.setAttribute('filter','');} }function attrs(n,o){Object.entries(o).forEach(([k,v])=>n.setAttribute(k,v))}function m .clientX-drag.x)/scale;oy=drag.oy+(e.clientY-drag.y)/scale;view()}if(drag.kind==='move'){let dx=p.x-drag.start.x,dy=p.y-drag.start.y;selected.setAttribute('transform',`${drag.original} translate(${dx} ${dy})`)}if(drag.kind==='pen'){drag.n.setAttribute('d',drag.n.getAttribute('d')+` L ${p.x} ${p.y}`)}});function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!drag)return;if(drag.kind==='shape'){let p=snap(pos(e));if(Math.hypot(p.x-drag.a.x,p.y-drag.a.y)>1){snapshot();selected=makeShape(tool,drag.a,p);renderSelection()}preview.innerHTML=''}drag=null}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',()=>{drag=null;pointers.clear();pinch=null;preview.innerHTML='' });$('finish').onclick=()=>{if(points.length>1){let n=el('polyline',{points:points.map(p=>`${p.x},${p.y}`).join(' '),...style(),fill:'none'});selected=n;renderSelection()}points=[];preview.innerHTML=''};$('delete').onclick=()=>{if(selected){snapshot();selected.remove();selected=null}};$('duplicate').onclick=()=>{if(selected){snapshot();let n=selected.cloneNode(true);n.setAttribute('transform',(n.getAttribute('transform')||'')+' translate(20 20)');art.append(n);selected=n;renderSelection()}};$('undo').onclick=()=>{if(history.length){future.push(art.innerHTML);restore(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(art.innerHTML);restore(future.pop())}};$('props').onclick=()=>$('panel').classList.toggle('show');['stroke','fill','sw','noFill'].forEach(id=>$(id).addEventListener('change',()=>{if(selected){snapshot();attrs(selected,style())}}));$('gridToggle').onclick=()=>{showGrid=!showGrid;$('gridBg').style.display=showGrid?'':'none'};$('zoomIn').onclick=()=>{scale=Math.min(15,scale*1.25);view()};$('zoomOut').onclick=()=>{scale=Math.max(.1,scale/1.25);view()};$('save').onclick=()=>{let s=`<svg xmlns="${ns}" viewBox="-500 -500 1000 1000">${art.innerHTML}</svg>`,url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='vectorboard.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let doc=new DOMParser().parseFromString(await f.text(),'image/svg+xml');if(doc.querySelector('parsererror'))return alert('SVG 解析失敗');snapshot();art.innerHTML='';for(let n of [...doc.documentElement.children]){if(['path','line','rect','ellipse','circle','polyline','polygon','g'].includes(n.localName)){let clean=document.createElementNS(ns,n.localName);for(let a of n.attributes)if(!/^on/i.test(a.name)&&!['href','style'].includes(a.name))clean.setAttribute(a.name,a.value);if(n.localName==='g')continue;art.append(clean)}}selected=null;e.target.value=''};window.addEventListener('resize',view);view();snapshot();</script></html>
